<!-- Two paths leaving the same point and never meeting again: the site's whole
     thesis, and the shape of its own race chart. Acid is the path that is
     ahead, grey the one behind - the same winner rule the site uses.
     Acid on ink measures 14.5:1, so the mark stays crisp at 16px. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0e0f0c"/>
  <path d="M6.5 17 25.5 7.5" stroke="#b6f25c" stroke-width="3.8" stroke-linecap="round"/>
  <path d="M6.5 17 25.5 23" stroke="#9aa197" stroke-width="2.6" stroke-linecap="round"/>
</svg>
